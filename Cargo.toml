[package]
name = "course-setup"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[[bin]]
name = "modern-cug-herper"
path = "src/main.rs"

[[test]]
name = "installer"
path = "tests/installer.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
zip = { version = "9.7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.5"

[profile.release]
opt-level = "z"
lto = true
strip = true
